<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="40 道番剧审美问卷：记录你具体为什么喜欢作品，并给出可追溯、可纠正的推荐。">
  <title>本命番推荐所</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231f7a4d'/%3E%3Ctext x='32' y='43' text-anchor='middle' font-size='34' fill='%23ffffff' font-family='sans-serif'%3E本%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <button class="brand" type="button" data-go-home aria-label="回到首页">
      <span class="brand-seal" aria-hidden="true">本</span>
      <span class="brand-type">
        <strong>本命番推荐所</strong>
        <small>ANIME SOUL LAB</small>
      </span>
    </button>
  </header>

  <main class="site-main">
    <!-- 开始页 -->
    <section class="screen intro-screen is-active" id="screen-intro">
      <div class="start-wrap" id="guest-start">
        <h1>找到你的下一部本命番</h1>
        <p class="start-lead">聊聊你为什么喜欢一部作品。</p>
        <div class="start-actions">
          <button class="start-button" id="start-btn" type="button">开始测试</button>
        </div>
        <p class="start-meta">40 道题 · 约 8–12 分钟</p>
        <div class="resume-card" id="resume-card" hidden>
          <div>
            <strong id="resume-title">上次的进度还在</strong>
            <span id="resume-text"></span>
          </div>
          <button class="outline-button" id="resume-btn" type="button">继续</button>
        </div>
      </div>
    </section>

    <!-- 40 题：q01–q39 -->
    <section class="screen test-screen" id="screen-test" aria-labelledby="question-text">
      <div class="test-shell">
        <div class="test-topline">
          <button class="test-exit" id="test-exit-btn" type="button"><span aria-hidden="true">←</span> 退出</button>
          <span class="test-mode" id="question-group">本命番推荐所</span>
          <span class="test-count" id="question-counter">01 <em>/ 40</em></span>
        </div>
        <div class="progress-track" role="progressbar" aria-valuemin="1" aria-valuemax="40" aria-valuenow="1" aria-label="答题进度">
          <span class="progress-fill" id="progress-fill"></span>
        </div>

        <div class="question-panel">
          <div class="question-meta">
            <span id="question-kind">观看经验与当下状态</span>
            <span class="question-meta-line" aria-hidden="true"></span>
            <span class="question-number" id="question-number">q01</span>
          </div>
          <h2 class="question-text" id="question-text" tabindex="-1"></h2>
          <p class="scale-instruction" id="scale-instruction"></p>
          <div class="options-grid" id="options" role="group" aria-labelledby="question-text"></div>
          <div class="test-bottomline">
            <button class="prev-button" id="prev-btn" type="button"><span aria-hidden="true">←</span> 上一题</button>
            <span class="keyboard-hint" id="keyboard-hint"></span>
            <span class="test-progress-note" id="test-progress-note"></span>
          </div>
        </div>

      </div>
    </section>

    <!-- 第 40 题：真正喜欢的作品 -->
    <section class="screen favorite-screen" id="screen-favorites" aria-labelledby="favorites-heading">
      <div class="step-shell">
        <div class="test-topline">
          <button class="test-exit" id="favorites-back-btn" type="button"><span aria-hidden="true">←</span> 回到第 39 题</button>
          <span class="test-mode">最后一题 · 第 40 题</span>
          <span class="test-count">40 <em>/ 40</em></span>
        </div>
        <div class="progress-track" role="progressbar" aria-valuemin="1" aria-valuemax="40" aria-valuenow="40" aria-label="答题进度">
          <span class="progress-fill is-complete"></span>
        </div>

        <div class="step-copy">
          <h2 id="favorites-heading">你真正喜欢的作品</h2>
          <p class="step-lead">填 1–5 部让你想重看、推荐或一直记得的作品。</p>
        </div>

        <form class="favorite-form" id="favorites-form" novalidate>
          <div id="taste-preferences"></div>          <div id="favorite-entries" class="favorite-entries"></div>
          <button class="outline-button add-favorite-button" id="add-favorite" type="button">＋ 再添加一部（最多 5 部）</button>

          <div class="publish-note">
            <strong id="favorite-publish-label">匿名发到树洞</strong>
            <p id="favorite-publish-note">树洞显示这一步填写的作品和理由。审美维度和推荐结果保存在账号档案。</p>
          </div>

          <button class="primary-button submit-button" id="submit-favorites" type="submit">发布并查看推荐</button>
          <p class="form-error" id="favorites-error" role="alert" hidden></p>
        </form>
      </div>
    </section>

    <!-- 计算中 -->
    <section class="screen loading-screen" id="screen-loading" aria-live="polite" aria-busy="true">
      <div class="loading-pulse" aria-hidden="true"><span></span></div>
      <h2 id="loading-title">正在整理你的 40 道回答</h2>
    </section>

    <!-- 结果页 -->
    <section class="screen result-screen" id="screen-result">
      <div class="result-wrap">
        <div class="result-topline">
          <div>
            <h2 class="result-heading">给你的推荐</h2>
          </div>
          <button class="outline-button" id="result-home" type="button" hidden>个人中心</button>
        </div>
        <p class="result-save-state" id="result-save-state" hidden></p>

        <article class="profile-card" id="profile-card">
          <div class="profile-copy">
            <p class="profile-kicker">你的审美画像</p>
            <h2 id="profile-title">本次回答的轮廓</h2>
            <p class="profile-description" id="profile-summary"></p>
            <div class="trait-chips" id="profile-evidence"></div>
            <p class="profile-footnote" id="profile-uncertainty"></p>
          </div>
        </article>

        <section class="recommendation-section" aria-labelledby="recommendation-heading">
          <div class="rec-heading"><h2 id="recommendation-heading">为你精选</h2></div>
          <div class="recommendation-list" id="recommendations"></div>
          <button class="outline-button" id="next-exploration" type="button" hidden>换一部探索推荐</button>
        </section>

        <section class="community-section" id="community-section" aria-labelledby="community-heading" hidden>
          <div class="rec-heading"><h2 id="community-heading">社区加推</h2></div>
          <div id="community-list"></div>
        </section>

        <details class="analysis-panel">
          <summary>查看推荐依据与本次回答的更多细节 <span aria-hidden="true">＋</span></summary>
          <div class="analysis-content" id="result-details"></div>
        </details>

      </div>
    </section>

    <!-- 树洞 -->
    <section class="screen tree-screen" id="screen-tree">
      <div class="tree-wrap">
        <nav class="hub-pieces" aria-label="站点专区" hidden>
          <button class="hub-piece" type="button" data-area="reviews"><span class="piece-icon" aria-hidden="true">◉</span><span>树洞</span></button>
          <button class="hub-piece" type="button" data-area="discover"><span class="piece-icon" aria-hidden="true">✦</span><span>想追番了</span></button>
          <button class="hub-piece" type="button" data-area="wanted"><span class="piece-icon" aria-hidden="true">▤</span><span>追番列表</span></button>
          <button class="hub-piece" type="button" data-area="profile"><span class="piece-icon" aria-hidden="true">◒</span><span>个人中心</span></button>
        </nav>
        <button class="test-exit" id="tree-back-btn" type="button" hidden><span aria-hidden="true">←</span> 返回</button>
        <nav class="tree-tabs" id="watchlist-tabs" aria-label="追番分区" hidden>
          <button type="button" data-tree-tab="wanted">待追</button>
          <button type="button" data-tree-tab="watched">已追</button>
        </nav>
        <nav class="tree-tabs" id="personal-tabs" aria-label="个人中心分区" hidden>
          <button type="button" data-tree-tab="profile">我的档案</button>
          <button type="button" data-tree-tab="history">足迹与分享</button>
          <button type="button" data-tree-tab="settings">个人设置</button>
          <button type="button" data-tree-tab="admin" id="admin-tab" hidden>管理</button>
        </nav>
        <div id="tree-content" class="tree-content"></div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="footer-links">
      <button type="button" id="help-open">数据与推荐说明</button>
    </div>
  </footer>

  <dialog class="modal-card account-dialog" id="account-modal" aria-labelledby="account-title">
    <div class="modal-head">
      <h2 id="account-title">我的账号</h2>
      <button class="modal-close" type="button" id="account-close" aria-label="关闭">×</button>
    </div>
    <div id="account-guest">
      <p id="account-message" class="tree-copy" hidden></p>
      <div class="account-modes" role="group" aria-label="账号操作">
        <button class="outline-button" type="button" data-account-mode="login" aria-pressed="true">登录</button>
        <button class="outline-button" type="button" data-account-mode="register" aria-pressed="false">注册</button>
      </div>
      <form id="account-form" class="tree-form">
        <label for="account-username">用户名</label>
        <input id="account-username" name="username" autocomplete="username" required minlength="3" maxlength="32" pattern="[A-Za-z0-9_]{3,32}" autocapitalize="none" spellcheck="false">
        <label for="account-password">密码</label>
        <div class="password-field">
          <input id="account-password" name="password" type="password" autocomplete="current-password" required>
          <button class="text-button" type="button" id="account-show-password" aria-pressed="false">显示</button>
        </div>
        <div class="account-confirm" id="account-confirm" hidden>
          <label for="account-repeat">再次输入密码</label>
          <input id="account-repeat" type="password" autocomplete="new-password">
          <p class="tree-copy">用户名使用 3–32 位英文字母、数字或下划线，密码至少 10 个字符。</p>
        </div>
        <button class="primary-button" type="submit" id="account-submit">登录</button>
      </form>
    </div>
    <p id="account-status" class="tree-copy" role="status"></p>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script src="test-data.js" defer></script>
  <script src="catalog.js" defer></script>
  <script src="media-assets.js" defer></script>
  <script src="taste-analysis.js" defer></script>
  <script src="series-data.js" defer></script>
  <script src="watch-model.js" defer></script>
  <script src="experience.js" defer></script>
  <script src="app.js" defer></script>
</body>
</html>
